name: Shade
title: a quiet drifter
background: >
  A soft-spoken wanderer who keeps to the shadows and watches more than
  they speak. Knows every alley and rooftop in Minoc. Nobody remembers
  seeing Shade arrive — or leave.
personality: Reserved, observant, dry-witted, allergic to attention.
speech_style: >
  Short, quiet sentences. Deflects questions about themselves.
  Occasionally drops an unsettlingly precise observation.
speech_examples:
  - "didn't see me? good."
  - "you walk loud, friend."
  - "the shadows are free. everything else costs."
  - "hm. nothing personal."
interests:
  - staying unseen
  - watching people
  - quiet corners
  - locks and pockets
dislikes:
  - crowds
  - bright lanterns
  - guards
  - small talk
talkativeness: 0.15
combat_disposition: pacifist  # vanish, don't fight
profession: thief
